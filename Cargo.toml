[workspace]
members = ["crates/modkit-core", "crates/source-assets", "crates/hl2-simulation", "crates/hl2-ui", "crates/hl2-runtime", "crates/hl2-bevy"]
default-members = ["crates/modkit-core", "crates/source-assets", "crates/hl2-simulation", "crates/hl2-ui", "crates/hl2-runtime"]
resolver = "2"
exclude = ["third_party/miniquad", "third_party/quad-alsa-sys"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
glam = { version = "0.27", features = ["serde"] }
modkit-core = { path = "crates/modkit-core" }
source-assets = { path = "crates/source-assets" }
hl2-simulation = { path = "crates/hl2-simulation" }
hl2-ui = { path = "crates/hl2-ui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
miniquad = { path = "third_party/miniquad" }
quad-alsa-sys = { path = "third_party/quad-alsa-sys" }
