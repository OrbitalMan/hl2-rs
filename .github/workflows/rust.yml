name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check architecture guardrails
        run: python scripts/checks/architecture.py
      - name: Check Python helpers
        run: python -m unittest discover -s scripts/checks -p "test_*.py"
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Check workspace lints
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo +stable test --workspace --locked --no-fail-fast

  portable:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev libdbus-1-dev
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Validate source, tests, lints and formatting
        run: scripts/checks/validate.sh
      - name: Check POSIX launcher syntax
        run: bash -n launch-bevy.sh scripts/build-bevy.sh scripts/clean-target.sh
