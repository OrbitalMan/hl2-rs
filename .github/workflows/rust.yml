name: Rust checks

on:
  push:
    branches: [main, bevy-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Check workspace lints
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo +stable test --workspace --locked
